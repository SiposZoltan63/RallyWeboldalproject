<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - Webshop</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background-image:url("img/rally.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}
.felso {
    background: rgba(51,51,51,0.95);
    padding:15px;
    text-align:center;
    position: sticky;
    top:0;
}
#ulb {
    list-style:none;
    padding:0;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}
.lib a, .admin-btn {
    text-decoration:none;
    color:white;
    padding:8px 12px;
    background:#555;
    border-radius:6px;
    cursor:pointer;
    border:none;
}
.container {
    padding:30px;
}
h1 { color:red; text-align:center; margin-bottom:20px; }
h2 { color:#00ff00; margin-top:40px; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { border:1px solid #ddd; padding:10px; text-align:left; }
th { background:#333; color:white; }
input { width:90%; padding:5px; }
button { padding:5px 10px; border:none; border-radius:5px; cursor:pointer; }
.btn-del { background:#dc3545; color:white; }
.add-form { background: rgba(0,0,0,0.85); padding:15px; border-radius:8px; margin-bottom:20px; }
.add-form input { margin-bottom:10px; display:block; }
.add-form button { background:#28a745; color:white; width:100%; }
</style>
</head>

<body>

<div class="felso">
<h1>ADMIN - Webshop</h1>

<ul id="ulb">
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/index.html">Főoldal</a></li>
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/motoreshajtaslanc.html">Motor és hajtáslánc</a></li>
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/futomueskormanyzas.html">Futómű és kormányzás</a></li>
</ul>
</div>

<div class="container">

<h2>Motor és hajtáslánc termékek</h2>

<div class="add-form">
    <h3>Új termék hozzáadása</h3>
    <input type="text" id="newMotorName" placeholder="Terméknév">
    <input type="number" id="newMotorPrice" placeholder="Ár (Ft)">
    <input type="text" id="newMotorImg" placeholder="Kép elérési út (pl: img/imgengineblocks/v8engineblock.jpg)">
    <button onclick="addNew('motor')">Hozzáadás</button>
</div>

<table>
    <thead>
        <tr>
            <th>Kép</th>
            <th>Terméknév</th>
            <th>Ár (Ft)</th>
            <th>Műveletek</th>
        </tr>
    </thead>
    <tbody id="motor-tbody"></tbody>
</table>

<h2>Futómű és kormányzás termékek</h2>

<div class="add-form">
    <h3>Új termék hozzáadása</h3>
    <input type="text" id="newFutomuName" placeholder="Terméknév">
    <input type="number" id="newFutomuPrice" placeholder="Ár (Ft)">
    <input type="text" id="newFutomuImg" placeholder="Kép elérési út (pl: img/futomu/sport.jpg)">
    <button onclick="addNew('futomu')">Hozzáadás</button>
</div>

<table>
    <thead>
        <tr>
            <th>Kép</th>
            <th>Terméknév</th>
            <th>Ár (Ft)</th>
            <th>Műveletek</th>
        </tr>
    </thead>
    <tbody id="futomu-tbody"></tbody>
</table>

</div>

<script>
let motorProducts = JSON.parse(localStorage.getItem("motor_products")) || [
    {id:1, name:"V8 Motorblokk", price:2170000, img:"img/imgengineblocks/v8engineblock.jpg"},
    {id:2, name:"V8 Hengerfej", price:210795, img:"img/imgcylinderheads/v8cylinderhead.png"}
];

let futomuProducts = JSON.parse(localStorage.getItem("futomu_products")) || [
    {id:1, name:"Sport futómű szett", price:350000, img:"img/futomu/sport.jpg"}
];

function save(type){
    if(type==='motor') localStorage.setItem("motor_products", JSON.stringify(motorProducts));
    else localStorage.setItem("futomu_products", JSON.stringify(futomuProducts));
}

function loadAdmin(){
    const motorBody = document.getElementById("motor-tbody");
    motorBody.innerHTML = "";
    motorProducts.forEach(p=>{
        motorBody.innerHTML+=`<tr>
            <td><img src="${p.img}" width="50"></td>
            <td><input type="text" value="${p.name}" onchange="edit('motor',${p.id},'name',this.value)"></td>
            <td><input type="number" value="${p.price}" onchange="edit('motor',${p.id},'price',this.value)"></td>
            <td><button class="btn-del" onclick="del('motor',${p.id})">Törlés</button></td>
        </tr>`;
    });

    const futomuBody = document.getElementById("futomu-tbody");
    futomuBody.innerHTML = "";
    futomuProducts.forEach(p=>{
        futomuBody.innerHTML+=`<tr>
            <td><img src="${p.img}" width="50"></td>
            <td><input type="text" value="${p.name}" onchange="edit('futomu',${p.id},'name',this.value)"></td>
            <td><input type="number" value="${p.price}" onchange="edit('futomu',${p.id},'price',this.value)"></td>
            <td><button class="btn-del" onclick="del('futomu',${p.id})">Törlés</button></td>
        </tr>`;
    });
}

function edit(type,id,field,value){
    let list = (type==='motor') ? motorProducts : futomuProducts;
    const item = list.find(p=>p.id===id);
    if(field==='price') value=parseInt(value);
    item[field]=value;
    save(type);
}

function del(type,id){
    if(confirm("Biztosan törlöd a terméket?")){
        let list = (type==='motor') ? motorProducts : futomuProducts;
        list = list.filter(p=>p.id!==id);
        if(type==='motor') motorProducts=list;
        else futomuProducts=list;
        save(type);
        loadAdmin();
    }
}

function addNew(type){
    let name, price, img;
    if(type==='motor'){
        name=document.getElementById("newMotorName").value;
        price=parseInt(document.getElementById("newMotorPrice").value);
        img=document.getElementById("newMotorImg").value || "img/imgengineblocks/default.jpg";
        if(!name||!price){alert("Hiányzó adat!"); return;}
        motorProducts.push({id:Date.now(), name:name, price:price, img:img});
        save('motor');
    } else {
        name=document.getElementById("newFutomuName").value;
        price=parseInt(document.getElementById("newFutomuPrice").value);
        img=document.getElementById("newFutomuImg").value || "img/futomu/default.jpg";
        if(!name||!price){alert("Hiányzó adat!"); return;}
        futomuProducts.push({id:Date.now(), name:name, price:price, img:img});
        save('futomu');
    }
    loadAdmin();
    document.getElementById(type==='motor'?"newMotorName":"newFutomuName").value="";
    document.getElementById(type==='motor'?"newMotorPrice":"newFutomuPrice").value="";
    document.getElementById(type==='motor'?"newMotorImg":"newFutomuImg").value="";
    alert("Termék hozzáadva!");
}

loadAdmin();
</script>

</body>
</html>
