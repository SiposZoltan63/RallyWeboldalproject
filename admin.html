<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - Futómű és kormányzás</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background-image:url("img/rally.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}
.felso {
    background: rgba(51,51,51,0.95);
    padding:15px;
    text-align:center;
    position: sticky;
    top:0;
}
#ulb {
    list-style:none;
    padding:0;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}
.lib a, .admin-btn {
    text-decoration:none;
    color:white;
    padding:8px 12px;
    background:#555;
    border-radius:6px;
    cursor:pointer;
    border:none;
}
.container {
    padding:30px;
}
h1 { color:red; text-align:center; margin-bottom:20px; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { border:1px solid #ddd; padding:10px; text-align:left; }
th { background:#333; color:white; }
input { width:90%; padding:5px; }
button { padding:5px 10px; border:none; border-radius:5px; cursor:pointer; }
.btn-del { background:#dc3545; color:white; }
.add-form { background: rgba(0,0,0,0.85); padding:15px; border-radius:8px; margin-bottom:20px; }
.add-form input { margin-bottom:10px; display:block; }
.add-form button { background:#28a745; color:white; width:100%; }
</style>
</head>

<body>

<div class="felso">
<h1>ADMIN - Futómű és kormányzás</h1>

<ul id="ulb">
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/index.html">Főoldal</a></li>
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/motoreshajtaslanc.html">Motor és hajtáslánc</a></li>
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/futomueskormanyzas.html">Futómű és kormányzás</a></li>
</ul>
</div>

<div class="container">
    <div class="add-form">
        <h3>Új termék hozzáadása</h3>
        <input type="text" id="newName" placeholder="Terméknév">
        <input type="number" id="newPrice" placeholder="Ár (Ft)">
        <input type="text" id="newImg" placeholder="Kép elérési út (pl: img/futomu/sport.jpg)">
        <button onclick="addNew()">Hozzáadás</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Kép</th>
                <th>Terméknév</th>
                <th>Ár (Ft)</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody id="admin-tbody"></tbody>
    </table>
</div>

<script>
let products = JSON.parse(localStorage.getItem("futomu_products")) || [];

function save(){
    localStorage.setItem("futomu_products", JSON.stringify(products));
}

function loadAdmin(){
    const tbody = document.getElementById("admin-tbody");
    tbody.innerHTML = "";
    products.forEach(p => {
        tbody.innerHTML += `
            <tr>
                <td><img src="${p.img}" width="50"></td>
                <td><input type="text" value="${p.name}" onchange="edit(${p.id},'name',this.value)"></td>
                <td><input type="number" value="${p.price}" onchange="edit(${p.id},'price',this.value)"></td>
                <td><button class="btn-del" onclick="del(${p.id})">Törlés</button></td>
            </tr>
        `;
    });
}

function edit(id, field, value){
    const item = products.find(p => p.id === id);
    if(field === "price") value = parseInt(value);
    item[field] = value;
    save();
}

function del(id){
    if(confirm("Biztosan törlöd a terméket?")){
        products = products.filter(p => p.id !== id);
        save();
        loadAdmin();
    }
}

function addNew(){
    const name = document.getElementById("newName").value;
    const price = parseInt(document.getElementById("newPrice").value);
    const img = document.getElementById("newImg").value || "img/futomu/default.jpg";

    if(!name || !price) { alert("Hiányzó adat!"); return; }

    products.push({
        id: Date.now(),
        name: name,
        price: price,
        img: img
    });

    save();
    loadAdmin();

    document.getElementById("newName").value = "";
    document.getElementById("newPrice").value = "";
    document.getElementById("newImg").value = "";

    alert("Termék hozzáadva!");
}

loadAdmin();
</script>

</body>
</html>
