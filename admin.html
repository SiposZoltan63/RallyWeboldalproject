<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - Futómű és Motor</title>
<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background-image:url("img/rally.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}
.felso {
    background: rgba(51,51,51,0.95);
    padding:15px;
    text-align:center;
    position: sticky;
    top:0;
}
#ulb {
    list-style:none;
    padding:0;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}
.lib a, .admin-btn {
    text-decoration:none;
    color:white;
    padding:8px 12px;
    background:#555;
    border-radius:6px;
    cursor:pointer;
    border:none;
}
.container { padding:30px; }
h1 { color:red; text-align:center; margin-bottom:20px; }
h2 { color:#00ff00; margin-top:40px; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { border:1px solid #ddd; padding:10px; text-align:left; }
th { background:#333; color:white; }
input { width:90%; padding:5px; }
button { padding:5px 10px; border:none; border-radius:5px; cursor:pointer; }
.btn-del { background:#dc3545; color:white; }
.add-form { background: rgba(0,0,0,0.85); padding:15px; border-radius:8px; margin-bottom:20px; }
.add-form input { margin-bottom:10px; display:block; }
.add-form button { background:#28a745; color:white; width:100%; }
</style>
</head>
<body>

<div class="felso">
<h1>ADMIN - Futómű és Motor</h1>
<ul id="ulb">
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/index.html">Főoldal</a></li>
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/motoreshajtaslanc.html">Motor és hajtáslánc</a></li>
<li class="lib"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/futomueskormanyzas.html">Futómű és kormányzás</a></li>
<li><button class="admin-btn"><a href="https://siposzoltan63.github.io/RallyWeboldalproject/admin.html">⚙️ ADMIN PAGE</a>⚙️ ADMIN PAGE</button></li>
</ul>
</div>

<div class="container">

<h2>Futómű és kormányzás</h2>
<div class="add-form">
    <h3>Új termék hozzáadása</h3>
    <input type="text" id="newNameFutomu" placeholder="Terméknév">
    <input type="number" id="newPriceFutomu" placeholder="Ár (Ft)">
    <input type="text" id="newImgFutomu" placeholder="Kép elérési út">
    <button onclick="addNew('futomu')">Hozzáadás</button>
</div>
<table>
<thead>
<tr>
<th>Kép</th><th>Terméknév</th><th>Ár (Ft)</th><th>Műveletek</th>
</tr>
</thead>
<tbody id="tbodyFutomu"></tbody>
</table>

<h2>Motor és hajtáslánc</h2>
<div class="add-form">
    <h3>Új termék hozzáadása</h3>
    <input type="text" id="newNameMotor" placeholder="Terméknév">
    <input type="number" id="newPriceMotor" placeholder="Ár (Ft)">
    <input type="text" id="newImgMotor" placeholder="Kép elérési út">
    <button onclick="addNew('motor')">Hozzáadás</button>
</div>
<table>
<thead>
<tr>
<th>Kép</th><th>Terméknév</th><th>Ár (Ft)</th><th>Műveletek</th>
</tr>
</thead>
<tbody id="tbodyMotor"></tbody>
</table>

</div>

<script>
// Betöltés LocalStorage-ból, vagy alapértelmezett lista
let futomu_products = JSON.parse(localStorage.getItem("futomu_products")) || [];
let motor_products = JSON.parse(localStorage.getItem("motor_products")) || [];

// Mentés LocalStorage-be
function save(type){
    if(type==='futomu') localStorage.setItem("futomu_products", JSON.stringify(futomu_products));
    else localStorage.setItem("motor_products", JSON.stringify(motor_products));
}

// Admin táblázat frissítése
function loadAdmin(){
    const tbodyF = document.getElementById("tbodyFutomu");
    tbodyF.innerHTML = "";
    futomu_products.forEach(p=>{
        tbodyF.innerHTML += `<tr>
            <td><img src="${p.img}" width="50"></td>
            <td><input type="text" value="${p.name}" onchange="edit('futomu',${p.id},'name',this.value)"></td>
            <td><input type="number" value="${p.price}" onchange="edit('futomu',${p.id},'price',this.value)"></td>
            <td><button class="btn-del" onclick="del('futomu',${p.id})">Törlés</button></td>
        </tr>`;
    });

    const tbodyM = document.getElementById("tbodyMotor");
    tbodyM.innerHTML = "";
    motor_products.forEach(p=>{
        tbodyM.innerHTML += `<tr>
            <td><img src="${p.img}" width="50"></td>
            <td><input type="text" value="${p.name}" onchange="edit('motor',${p.id},'name',this.value)"></td>
            <td><input type="number" value="${p.price}" onchange="edit('motor',${p.id},'price',this.value)"></td>
            <td><button class="btn-del" onclick="del('motor',${p.id})">Törlés</button></td>
        </tr>`;
    });
}

// Szerkesztés
function edit(type,id,field,value){
    let arr = type==='futomu'?futomu_products:motor_products;
    const item = arr.find(p=>p.id===id);
    if(field==='price') value=parseInt(value);
    item[field]=value;
    save(type);
}

// Törlés
function del(type,id){
    if(confirm("Biztosan törlöd a terméket?")){
        if(type==='futomu') futomu_products = futomu_products.filter(p=>p.id!==id);
        else motor_products = motor_products.filter(p=>p.id!==id);
        save(type);
        loadAdmin();
    }
}

// Új termék hozzáadása
function addNew(type){
    let name, price, img;
    if(type==='futomu'){
        name=document.getElementById("newNameFutomu").value;
        price=parseInt(document.getElementById("newPriceFutomu").value);
        img=document.getElementById("newImgFutomu").value || "img/futomu/default.jpg";
    } else {
        name=document.getElementById("newNameMotor").value;
        price=parseInt(document.getElementById("newPriceMotor").value);
        img=document.getElementById("newImgMotor").value || "img/imgengineblocks/default.jpg";
    }
    if(!name || !price){ alert("Hiányzó adat!"); return; }

    const newItem = {id: Date.now(), name:name, price:price, img:img};
    if(type==='futomu') futomu_products.push(newItem);
    else motor_products.push(newItem);

    save(type);
    loadAdmin();

    // Űrlap ürítése
    if(type==='futomu'){ document.getElementById("newNameFutomu").value=""; document.getElementById("newPriceFutomu").value=""; document.getElementById("newImgFutomu").value=""; }
    else{ document.getElementById("newNameMotor").value=""; document.getElementById("newPriceMotor").value=""; document.getElementById("newImgMotor").value=""; }

    alert("Termék hozzáadva!");
}

// Betöltés induláskor
loadAdmin();
</script>

</body>
</html>
