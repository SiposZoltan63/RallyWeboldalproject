<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Tuning - Webshop és Admin</title>
    <style>
        :root {
            --main-red: #ff0000;
            --dark-grey: #222;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url("img/rally.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a1a1a;
            color: white;
        }

        /* Navigáció */
        .felso {
            background-color: rgba(51, 51, 51, 0.95);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--main-red);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .felso h1 { color: var(--main-red); margin: 0 0 10px 0; }

        #ulb {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lib a, .admin-btn {
            text-decoration: none;
            color: white;
            padding: 10px 15px;
            background: #444;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }

        .lib a:hover, .admin-btn:hover { background: var(--main-red); }
        .admin-active { background: #ffc107 !important; color: black !important; }

        /* Kereső */
        .search-container { margin-top: 15px; }
        #searchBar {
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            border: none;
        }

        /* Bolt Megjelenés */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 40px;
            justify-content: center;
        }

        .product-card {
            background: rgba(0,0,0,0.85);
            width: 250px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #444;
        }

        .product-card img { width: 100%; height: 170px; object-fit: cover; border-radius: 8px; }
        .price { color: #00ff00; font-size: 1.2em; font-weight: bold; }

        /* ADMIN PANEL */
        #admin-view {
            display: none;
            background: white;
            color: #222;
            min-height: 80vh;
            margin: 20px;
            padding: 30px;
            border-radius: 15px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .admin-table th, .admin-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .admin-table th { background: #333; color: white; }

        .input-edit {
            padding: 8px;
            width: 90%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-del {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .add-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }

        /* Kosár */
        #cart-panel {
            position: fixed;
            right: 20px;
            top: 150px;
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            display: none;
            z-index: 2000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="felso">
    <h1 id="main-title">Motor és hajtáslánc</h1>
    <ul id="ulb">
        <li class="lib"><a href="index.html">Főoldal</a></li>
        <li class="lib"><a href="motoreshajtaslanc.html">Motor és hajtáslánc</a></li>
        <li class="lib"><a href="futomueskormanyzas.html">Futómű és kormányzás</a></li>
        <li><button class="admin-btn" onclick="toggleCart()">🛒 Kosár (<span id="cart-count">0</span>)</button></li>
        <li><button class="admin-btn" id="adminToggle" onclick="switchMode()">⚙️ ADMIN PAGE</button></li>
    </ul>

    <div id="searchArea">
        <input type="text" id="searchBar" placeholder="Keresés a termékek között..." onkeyup="loadShop()">
    </div>
</div>

<!-- VÁSÁRLÓI NÉZET -->
<div id="shop-view">
    <div class="container" id="product-grid"></div>
</div>

<!-- ADMIN NÉZET -->
<div id="admin-view">
    <h2 style="color: black;">Termékek kezelése (Módosítás / Törlés)</h2>
    
    <div class="add-form">
        <h4>Új termék hozzáadása</h4>
        <input type="text" id="newName" placeholder="Név">
        <input type="number" id="newPrice" placeholder="Ár (Ft)">
        <input type="text" id="newImg" placeholder="Kép (pl: img/motor.jpg)">
        <button onclick="createNewProduct()" style="background: #28a745; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">Hozzáadás</button>
    </div>

    <table class="admin-table">
        <thead>
            <tr>
                <th>Kép</th>
                <th>Terméknév (Szerkeszthető)</th>
                <th>Ár (Ft) (Szerkeszthető)</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody id="admin-tbody"></tbody>
    </table>
</div>

<!-- KOSÁR -->
<div id="cart-panel">
    <h3>Kosár</h3>
    <ul id="cart-list"></ul>
    <hr>
    <p>Összesen: <b id="total-price">0</b> Ft</p>
    <button onclick="toggleCart()" style="width: 100%;">Bezárás</button>
</div>

<script>
    // ADATOK
    let products = [
        { id: 1, name: "V8 Motorblokk", price: 2170000, img: "img/imgengineblocks/v8engineblock.jpg" },
        { id: 2, name: "V8 Hengerfej", price: 210795, img: "img/imgcylinderheads/v8cylinderhead.png" },
        { id: 3, name: "V8 Turbófeltöltő", price: 178074, img: "img/imgturbocharger/turbofeltolto.jpg" },
        { id: 4, name: "Sebességváltó", price: 5050000, img: "img/gearboxs/samsomasszekvencialisvalto.jpg" }
    ];

    let cart = [];
    let isAdmin = false;

    // NÉZETVÁLTÓ
    function switchMode() {
        isAdmin = !isAdmin;
        const shop = document.getElementById('shop-view');
        const admin = document.getElementById('admin-view');
        const search = document.getElementById('searchArea');
        const btn = document.getElementById('adminToggle');
        const title = document.getElementById('main-title');

        if (isAdmin) {
            shop.style.display = 'none';
            admin.style.display = 'block';
            search.style.display = 'none';
            btn.innerText = "🔙 Vissza a Shopba";
            btn.classList.add('admin-active');
            title.innerText = "ADMINISZTRÁCIÓ";
            loadAdmin();
        } else {
            shop.style.display = 'block';
            admin.style.display = 'none';
            search.style.display = 'block';
            btn.innerText = "⚙️ ADMIN PAGE";
            btn.classList.remove('admin-active');
            title.innerText = "Motor és hajtáslánc";
            loadShop();
        }
    }

    // BOLT BETÖLTÉSE
    function loadShop() {
        const grid = document.getElementById('product-grid');
        const query = document.getElementById('searchBar').value.toLowerCase();
        grid.innerHTML = "";

        products.filter(p => p.name.toLowerCase().includes(query)).forEach(p => {
            grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p class="price">${p.price.toLocaleString()} Ft</p>
                    <button class="lib" style="width:100%;" onclick="addToCart('${p.name}', ${p.price})">KOSÁRBA</button>
                </div>
            `;
        });
    }

    // ADMIN TÁBLÁZAT (Módosítás + Törlés)
    function loadAdmin() {
        const tbody = document.getElementById('admin-tbody');
        tbody.innerHTML = "";

        products.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td><img src="${p.img}" width="50"></td>
                    <td><input type="text" class="input-edit" value="${p.name}" onchange="editData(${p.id}, 'name', this.value)"></td>
                    <td><input type="number" class="input-edit" value="${p.price}" onchange="editData(${p.id}, 'price', this.value)"></td>
                    <td><button class="btn-del" onclick="deleteItem(${p.id})">Törlés</button></td>
                </tr>
            `;
        });
    }

    // ADMIN MŰVELETEK
    function editData(id, field, value) {
        let p = products.find(x => x.id === id);
        if (field === 'price') value = parseInt(value);
        p[field] = value;
        console.log("Frissítve:", products);
    }

    function deleteItem(id) {
        if (confirm("Biztosan törlöd ezt a terméket a kínálatból?")) {
            products = products.filter(x => x.id !== id);
            loadAdmin();
        }
    }

    function createNewProduct() {
        const n = document.getElementById('newName').value;
        const p = parseInt(document.getElementById('newPrice').value);
        const i = document.getElementById('newImg').value;
        if (n && p) {
            products.push({ id: Date.now(), name: n, price: p, img: i || 'img/v8.jpg' });
            loadAdmin();
            alert("Termék hozzáadva!");
        }
    }

    // KOSÁR FUNKCIÓK
    function addToCart(name, price) {
        cart.push({name, price});
        updateCart();
    }

    function updateCart() {
        document.getElementById('cart-count').innerText = cart.length;
        const list = document.getElementById('cart-list');
        let total = 0;
        list.innerHTML = "";
        cart.forEach(item => {
            total += item.price;
            list.innerHTML += `<li>${item.name}</li>`;
        });
        document.getElementById('total-price').innerText = total.toLocaleString();
    }

    function toggleCart() {
        const cp = document.getElementById('cart-panel');
        cp.style.display = (cp.style.display === 'block') ? 'none' : 'block';
    }

    // Alapértelmezett indítás
    loadShop();
</script>

</body>
</html>
