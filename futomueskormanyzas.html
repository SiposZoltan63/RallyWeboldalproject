<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futómű és kormányzás</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("img/rally.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a1a1a;
            color: white;
        }

        .felso {
            background-color: rgba(51, 51, 51, 0.95);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        #ulb {
            list-style-type: none;
            padding: 0;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .lib a, .cart-btn {
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            background-color: #555;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
            justify-content: center;
        }

        .product-card {
            background-color: rgba(0,0,0,0.85);
            width: 240px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 5px;
        }

        .price {
            color: #00ff00;
            font-weight: bold;
            font-size: 1.2em;
            margin: 10px 0;
        }

        #cart-panel {
            position: fixed;
            right: 20px;
            top: 150px;
            background: white;
            color: black;
            padding: 15px;
            border-radius: 8px;
            width: 260px;
            display: none;
            z-index: 2000;
        }
    </style>
</head>

<body>

<div class="felso">
    <h1 style="color:red;">Futómű és kormányzás</h1>

    <ul id="ulb">
        <li class="lib">
            <a href="https://siposzoltan63.github.io/RallyWeboldalproject/index.html">Főoldal</a>
        </li>
        <li class="lib">
            <a href="https://siposzoltan63.github.io/RallyWeboldalproject/motoreshajtaslanc.html">Motor és hajtáslánc</a>
        </li>
        <li class="lib">
            <a href="https://siposzoltan63.github.io/RallyWeboldalproject/futomueskormanyzas.html">Futómű és kormányzás</a>
        </li>
        <li>
            <button class="cart-btn" onclick="toggleCart()">
                🛒 Kosár (<span id="cart-count">0</span>)
            </button>
        </li>
    </ul>

    <input type="text" id="searchBar" placeholder="Keresés..." onkeyup="renderProducts()">
</div>

<div class="container" id="productGrid"></div>

<div id="cart-panel">
    <h3>🛒 Kosár</h3>
    <ul id="cart-list"></ul>
    <p><b>Összesen: <span id="total">0</span> Ft</b></p>
    <button onclick="toggleCart()">Bezárás</button>
</div>

<script>
    /* TERMÉKEK BETÖLTÉSE LOCALSTORAGE-BŐL */
    function getProducts() {
        const data = localStorage.getItem("futomu_products");
        return data ? JSON.parse(data) : [
            {
                id: 1,
                name: "Sport futómű szett",
                price: 350000,
                img: "img/futomu/sport.jpg"
            }
        ];
    }

    let products = getProducts();
    let cart = [];

    /* TERMÉKEK MEGJELENÍTÉSE */
    function renderProducts() {
        const grid = document.getElementById("productGrid");
        const query = document.getElementById("searchBar").value.toLowerCase();
        grid.innerHTML = "";

        products
            .filter(p => p.name.toLowerCase().includes(query))
            .forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p class="price">${p.price.toLocaleString()} Ft</p>
                        <button onclick="addToCart('${p.name}', ${p.price})">Kosárba</button>
                    </div>
                `;
            });
    }

    /* KOSÁR FUNKCIÓK */
    function addToCart(name, price) {
        cart.push({ name, price });
        updateCart();
    }

    function updateCart() {
        document.getElementById("cart-count").innerText = cart.length;

        const list = document.getElementById("cart-list");
        let total = 0;
        list.innerHTML = "";

        cart.forEach(item => {
            total += item.price;
            list.innerHTML += `<li>${item.name}</li>`;
        });

        document.getElementById("total").innerText = total.toLocaleString();
    }

    function toggleCart() {
        const panel = document.getElementById("cart-panel");
        panel.style.display = panel.style.display === "block" ? "none" : "block";
    }

    renderProducts();
</script>

</body>
</html>
